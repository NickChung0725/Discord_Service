<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="robots" content="noindex, nofollow, noarchive" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; connect-src 'self'; img-src 'self' data:; object-src 'none'; base-uri 'self'; form-action 'self';" />
  <meta name="theme-color" content="#0b0f14" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="manifest" href="./manifest.webmanifest" />
  <title>MY_STOCK</title>
  <style>
    :root {
      --bg: #0b0f14;
      --surface: #111827;
      --surface-2: #161f30;
      --surface-3: #0d131f;
      --border: #243042;
      --border-strong: #334155;
      --text: #e6edf3;
      --text-muted: #94a3b8;
      --text-dim: #64748b;
      --blue: #3b82f6;
      --blue-soft: rgba(59, 130, 246, 0.14);
      --blue-text: #93c5fd;
      --green: #10b981;
      --green-soft: rgba(16, 185, 129, 0.15);
      --green-text: #34d399;
      --amber: #f59e0b;
      --amber-soft: rgba(245, 158, 11, 0.15);
      --amber-text: #fbbf24;
      --red: #ef4444;
      --red-soft: rgba(239, 68, 68, 0.16);
      --red-text: #f87171;
      --purple-soft: rgba(168, 85, 247, 0.16);
      --purple-text: #d8b4fe;
      --radius: 12px;
      --radius-sm: 8px;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0; padding: 0; background: var(--bg); color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans TC", "Microsoft JhengHei", sans-serif;
      line-height: 1.5; -webkit-text-size-adjust: 100%;
    }
    a { color: var(--blue-text); text-decoration: none; }
    a:hover { text-decoration: underline; }
    button { font-family: inherit; cursor: pointer; color: inherit; }
    input, select { font-family: inherit; }
    .num { font-variant-numeric: tabular-nums; }
    .hidden { display: none !important; }
    .up { color: #f87171; } /* 台股紅漲 */
    .down { color: #34d399; } /* 台股綠跌 */
    .flat { color: var(--text-muted); }

    /* Lock Screen */
    #lock-screen {
      min-height: 100vh; display: flex; align-items: center; justify-content: center;
      padding: 20px; background: radial-gradient(circle at top, #132036 0%, #0b0f14 65%);
    }
    .lock-card {
      width: 100%; max-width: 390px; background: var(--surface); border: 1px solid var(--border);
      border-radius: 16px; padding: 28px 24px; box-shadow: 0 20px 50px rgba(0, 0, 0, 0.55);
    }
    .lock-title { margin: 0 0 6px; font-size: 22px; font-weight: 700; letter-spacing: 0.5px; }
    .lock-sub { margin: 0 0 20px; font-size: 13px; color: var(--text-muted); }
    .lock-input {
      width: 100%; height: 44px; padding: 0 14px; border-radius: 10px;
      border: 1px solid var(--border-strong); background: var(--surface-3); color: var(--text);
      font-size: 15px; outline: none;
    }
    .lock-input:focus { border-color: var(--blue); }
    .lock-remember {
      display: flex; align-items: center; gap: 8px; margin: 14px 0 18px;
      font-size: 13px; color: var(--text-muted); cursor: pointer; user-select: none;
    }
    .lock-btn {
      width: 100%; height: 44px; border: none; border-radius: 10px; background: var(--blue);
      color: #fff; font-size: 15px; font-weight: 600; transition: opacity 0.15s;
    }
    .lock-btn:disabled { opacity: 0.55; cursor: wait; }
    .lock-err { margin-top: 12px; font-size: 13px; color: var(--red-text); min-height: 20px; }

    /* Privacy Auto-Blur Curtain */
    #privacy-curtain {
      position: fixed; inset: 0; z-index: 200; background: rgba(11, 15, 20, 0.88);
      backdrop-filter: blur(18px); display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 12px; cursor: pointer;
    }
    .curtain-box {
      background: var(--surface); border: 1px solid var(--border-strong);
      border-radius: 16px; padding: 24px 32px; text-align: center;
    }

    /* Topbar */
    .topbar {
      position: sticky; top: 0; z-index: 40;
      background: rgba(11, 15, 20, 0.95); backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--border);
    }
    .topbar-inner { max-width: 1320px; margin: 0 auto; padding: 10px 16px; display: flex; flex-direction: column; gap: 8px; }
    .topbar-row { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px; }
    .brand { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
    .brand h1 { margin: 0; font-size: 18px; font-weight: 700; color: #f8fafc; }
    .badge {
      display: inline-flex; align-items: center; gap: 4px; padding: 2px 8px;
      border-radius: 999px; font-size: 12px; font-weight: 600; white-space: nowrap;
      border: 1px solid transparent;
    }
    .badge-blue { background: var(--blue-soft); color: var(--blue-text); border-color: rgba(59,130,246,0.3); }
    .badge-green { background: var(--green-soft); color: var(--green-text); border-color: rgba(16,185,129,0.3); }
    .badge-amber { background: var(--amber-soft); color: var(--amber-text); border-color: rgba(245,158,11,0.3); }
    .badge-red { background: var(--red-soft); color: var(--red-text); border-color: rgba(239,68,68,0.35); }
    .badge-purple { background: var(--purple-soft); color: var(--purple-text); border-color: rgba(168,85,247,0.35); }
    .badge-muted { background: var(--surface-2); color: var(--text-muted); border-color: var(--border); }

    .controls { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
    .btn, .ctrl-select, .search-input {
      background: var(--surface-2); color: var(--text); border: 1px solid var(--border-strong);
      border-radius: var(--radius-sm); font-size: 12.5px; height: 34px; padding: 0 10px;
      display: inline-flex; align-items: center; gap: 4px; white-space: nowrap;
    }
    .btn:hover { border-color: var(--blue); background: #1d293f; }
    .btn-primary { background: var(--blue); border-color: var(--blue); color: #fff; font-weight: 600; }
    .btn-primary:hover { background: #2563eb; }
    .btn-danger { border-color: rgba(239,68,68,0.45); color: var(--red-text); }
    .btn-active { border-color: var(--amber); background: var(--amber-soft); color: var(--amber-text); }

    /* Alert Bars */
    .alert-bar {
      border-radius: var(--radius-sm); padding: 9px 12px; font-size: 13px;
      display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px;
    }
    .alert-red { background: rgba(239,68,68,0.18); border: 1px solid rgba(239,68,68,0.5); color: #fecaca; }
    .alert-amber { background: rgba(245,158,11,0.16); border: 1px solid rgba(245,158,11,0.45); color: #fde68a; }
    .alert-green { background: rgba(16,185,129,0.14); border: 1px solid rgba(16,185,129,0.4); color: #a7f3d0; }

    /* Gap Stress Slider */
    .gap-bar {
      display: flex; flex-wrap: wrap; align-items: center; gap: 10px;
      background: var(--surface-3); border: 1px solid var(--border);
      border-radius: var(--radius-sm); padding: 6px 12px; font-size: 12.5px;
    }
    .gap-bar input[type="range"] { width: 150px; accent-color: var(--amber); }

    /* Macro Strip */
    .macro-strip {
      display: flex; flex-wrap: wrap; align-items: center; gap: 6px; font-size: 12px;
      background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-sm);
      padding: 7px 10px; cursor: pointer;
    }
    .macro-detail {
      margin-top: 6px; padding: 10px 12px; background: var(--surface-3);
      border: 1px solid var(--border); border-radius: var(--radius-sm); font-size: 12.5px;
      color: var(--text-muted);
    }

    /* Main Layout */
    .container { max-width: 1320px; margin: 0 auto; padding: 14px 16px 80px; display: flex; flex-direction: column; gap: 16px; }
    .section-hdr { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 8px; }
    .section-title { margin: 0; font-size: 15px; font-weight: 700; display: flex; align-items: center; gap: 6px; }

    /* Pool Tabs & KPI Grid */
    .pill-group { display: inline-flex; background: var(--surface); border: 1px solid var(--border); border-radius: 999px; padding: 3px; gap: 3px; }
    .pill-btn {
      border: none; background: transparent; color: var(--text-muted); font-size: 12.5px;
      padding: 5px 12px; border-radius: 999px; font-weight: 600;
    }
    .pill-btn.active { background: var(--blue); color: #fff; }
    .kpi-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; }
    .card {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 14px;
    }
    .kpi-label { font-size: 12px; color: var(--text-muted); margin-bottom: 4px; }
    .kpi-val { font-size: 21px; font-weight: 700; letter-spacing: -0.3px; }
    .kpi-sub { font-size: 12px; color: var(--text-muted); margin-top: 4px; }

    /* Boss Key Blur */
    body.boss-mode .money { filter: blur(8px); user-select: none; }

    /* Battle Queue */
    .brief-box {
      background: linear-gradient(135deg, rgba(59,130,246,0.1), rgba(16,185,129,0.06));
      border: 1px solid rgba(59,130,246,0.3); border-radius: var(--radius); padding: 12px 14px;
      font-size: 13px;
    }
    .brief-full {
      margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--border);
      white-space: pre-wrap; font-size: 12.5px; color: var(--text-muted); max-height: 360px; overflow-y: auto;
    }
    .queue-group { margin-top: 10px; }
    .queue-group-hdr {
      font-size: 13px; font-weight: 700; padding: 6px 10px; border-radius: var(--radius-sm);
      display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; cursor: pointer;
    }
    .q-p0 { background: rgba(239,68,68,0.14); border: 1px solid rgba(239,68,68,0.4); color: #fca5a5; }
    .q-p1 { background: rgba(16,185,129,0.14); border: 1px solid rgba(16,185,129,0.4); color: #6ee7b7; }
    .q-p2 { background: rgba(245,158,11,0.14); border: 1px solid rgba(245,158,11,0.4); color: #fcd34d; }
    .q-p3 { background: var(--surface-2); border: 1px solid var(--border); color: var(--text-muted); }

    .action-cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(310px, 1fr)); gap: 10px; }
    .action-card {
      background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
      padding: 12px; display: flex; flex-direction: column; gap: 7px; transition: opacity 0.2s, border-color 0.15s;
    }
    .action-card:hover { border-color: var(--blue); }
    .action-card.done { opacity: 0.48; }
    .copy-chip {
      display: inline-flex; align-items: center; gap: 4px; padding: 2px 8px;
      border-radius: 6px; background: var(--surface-3); border: 1px solid var(--border-strong);
      font-size: 12.5px; font-weight: 700; cursor: pointer;
    }
    .copy-chip:hover { border-color: var(--blue); color: var(--blue-text); }

    /* Holdings Table */
    .table-wrap { overflow-x: auto; border: 1px solid var(--border); border-radius: var(--radius); background: var(--surface); }
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th, td { padding: 10px 10px; border-bottom: 1px solid var(--border); text-align: left; vertical-align: middle; }
    th { background: var(--surface-2); color: var(--text-muted); font-size: 12px; font-weight: 600; white-space: nowrap; }
    tbody tr { cursor: pointer; transition: background 0.12s; }
    tbody tr:hover { background: rgba(59, 130, 246, 0.08); }
    tbody tr.selected-row { background: rgba(59, 130, 246, 0.16); }

    .price-edit-btn {
      background: var(--surface-3); border: 1px dashed var(--border-strong);
      border-radius: 6px; padding: 2px 7px; font-size: 13px; font-weight: 700;
    }
    .price-edit-btn.overridden { border-style: solid; border-color: var(--amber); color: var(--amber-text); }

    /* Inline Gauge */
    .gauge-track { position: relative; height: 8px; width: 110px; background: #1e293b; border-radius: 99px; overflow: visible; }
    .gauge-fill { position: absolute; top: 0; bottom: 0; left: 0; border-radius: 99px; background: linear-gradient(90deg, #ef4444, #f59e0b, #10b981); opacity: 0.45; }
    .gauge-dot { position: absolute; top: -3px; width: 14px; height: 14px; border-radius: 50%; background: #f8fafc; border: 2px solid var(--blue); transform: translateX(-50%); }

    /* Bullet Bar */
    .bullets { display: inline-flex; gap: 3px; align-items: center; }
    .bullet-seg { width: 14px; height: 6px; border-radius: 3px; background: #1e293b; border: 1px solid var(--border-strong); }
    .bullet-seg.fired { background: var(--blue); border-color: var(--blue); }

    /* Zone 5 Grid */
    .two-col { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
    .weekday-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; margin: 10px 0; }
    .wday {
      text-align: center; padding: 6px 4px; border-radius: 8px; font-size: 12px; font-weight: 600;
      background: var(--surface-3); border: 1px solid var(--border); color: var(--text-muted);
    }
    .wday.bought { background: var(--green-soft); border-color: var(--green); color: var(--green-text); }

    /* Drawer */
    .drawer-backdrop {
      position: fixed; inset: 0; z-index: 90; background: rgba(0, 0, 0, 0.55);
      display: flex; justify-content: flex-end;
    }
    .drawer {
      width: 680px; max-width: 100vw; height: 100vh; background: var(--bg);
      border-left: 1px solid var(--border-strong); display: flex; flex-direction: column;
      box-shadow: -12px 0 40px rgba(0, 0, 0, 0.6);
    }
    .drawer-hdr {
      position: sticky; top: 0; z-index: 5; background: var(--surface);
      border-bottom: 1px solid var(--border); padding: 14px 16px;
    }
    .drawer-tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--border); padding: 0 16px; background: var(--surface); overflow-x: auto; }
    .dtab {
      border: none; background: transparent; padding: 10px 12px; font-size: 13px;
      font-weight: 600; color: var(--text-muted); border-bottom: 2px solid transparent; white-space: nowrap;
    }
    .dtab.active { color: var(--blue-text); border-bottom-color: var(--blue); }
    .drawer-body { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 14px; }

    /* Multi-Anchor Ruler */
    .ruler-wrap { position: relative; padding: 34px 10px 38px; background: var(--surface-3); border: 1px solid var(--border); border-radius: var(--radius-sm); }
    .ruler-bar { position: relative; height: 8px; border-radius: 99px; background: linear-gradient(90deg, #ef4444 0%, #f59e0b 45%, #3b82f6 65%, #10b981 100%); }
    .ruler-pin { position: absolute; transform: translateX(-50%); text-align: center; font-size: 11px; white-space: nowrap; }
    .ruler-pin.top { bottom: 14px; }
    .ruler-pin.bot { top: 14px; }
    .ruler-tick { width: 2px; height: 10px; background: #cbd5e1; margin: 0 auto; }

    /* Modal */
    .modal-backdrop {
      position: fixed; inset: 0; z-index: 110; background: rgba(0, 0, 0, 0.68);
      display: flex; align-items: center; justify-content: center; padding: 16px;
    }
    .modal-box {
      width: 100%; max-width: 660px; max-height: 88vh; background: var(--surface);
      border: 1px solid var(--border-strong); border-radius: 14px; display: flex; flex-direction: column;
    }
    .modal-hdr { padding: 14px 16px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; }
    .modal-body { padding: 14px 16px; overflow-y: auto; flex: 1; }
    .modal-ftr { padding: 12px 16px; border-top: 1px solid var(--border); background: var(--surface-3); border-radius: 0 0 14px 14px; }

    /* Timeline & Thesis Boxes */
    .thesis-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
    .thesis-bull { background: rgba(59,130,246,0.1); border: 1px solid rgba(59,130,246,0.35); border-radius: var(--radius-sm); padding: 10px 12px; font-size: 12.5px; }
    .thesis-bear { background: rgba(239,68,68,0.1); border: 1px solid rgba(239,68,68,0.35); border-radius: var(--radius-sm); padding: 10px 12px; font-size: 12.5px; }
    .tl-item { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 10px 12px; font-size: 12.5px; display: flex; flex-direction: column; gap: 5px; }

    /* Toast */
    #toast {
      position: fixed; bottom: 72px; left: 50%; transform: translateX(-50%); z-index: 250;
      background: #1e293b; border: 1px solid var(--blue); color: #f8fafc;
      padding: 8px 16px; border-radius: 999px; font-size: 13px; font-weight: 600;
      box-shadow: 0 8px 24px rgba(0,0,0,0.45); opacity: 0; pointer-events: none; transition: opacity 0.2s;
    }
    #toast.show { opacity: 1; }

    /* Mobile Bottom Nav */
    .mobile-nav {
      display: none; position: fixed; bottom: 0; left: 0; right: 0; z-index: 60;
      background: rgba(17, 24, 39, 0.97); backdrop-filter: blur(10px);
      border-top: 1px solid var(--border); padding: 6px 4px calc(6px + env(safe-area-inset-bottom));
    }
    .mobile-nav-inner { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; }
    .mnav-btn {
      border: none; background: transparent; color: var(--text-muted); font-size: 11.5px;
      padding: 6px 2px; border-radius: 8px; display: flex; flex-direction: column; align-items: center; gap: 2px;
    }
    .mnav-btn.active { color: var(--blue-text); background: var(--blue-soft); font-weight: 700; }

    /* Desktop Perf Tab Switcher */
    .main-view-tabs { display: inline-flex; gap: 6px; }

    /* Responsive <= 768px */
    @media (max-width: 768px) {
      .kpi-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .two-col, .thesis-grid { grid-template-columns: 1fr; }
      .drawer { width: 100vw; border-left: none; }
      .mobile-nav { display: block; }
      .desktop-only { display: none !important; }
      .container { padding: 10px 10px 86px; }
      .kpi-val { font-size: 17px; }
    }
    /* Safe Markdown Strategic Reader (SASD v6.3.1) */
    .md-body { font-size: 14px; line-height: 1.75; color: var(--text); word-break: break-word; }
    .md-body h1, .md-body h2 { font-size: 16px; color: var(--blue-text); margin: 18px 0 8px; padding-bottom: 5px; border-bottom: 1px solid var(--border); }
    .md-body h3 { font-size: 15px; color: var(--amber-text); margin: 14px 0 6px; }
    .md-body h4 { font-size: 14px; color: var(--green-text); margin: 10px 0 4px; }
    .md-body p { margin: 6px 0 10px; }
    .md-body ul, .md-body ol { margin: 6px 0 10px; padding-left: 20px; }
    .md-body li { margin: 4px 0; }
    .md-body blockquote { margin: 8px 0; padding: 8px 12px; border-left: 3px solid var(--blue); background: var(--surface-3); color: var(--text-muted); border-radius: 6px; }
    .md-body code { background: var(--surface-3); color: var(--blue-text); padding: 1px 5px; border-radius: 4px; font-size: 12.5px; }
    .md-body hr { border: none; border-top: 1px solid var(--border); margin: 14px 0; }
    .md-body table { width: 100%; border-collapse: collapse; font-size: 12.5px; margin: 10px 0; display: block; overflow-x: auto; }
    .md-body th, .md-body td { border: 1px solid var(--border); padding: 6px 8px; text-align: left; white-space: nowrap; }
    .md-body th { background: var(--surface-2); color: var(--text-muted); font-weight: 600; }
    .playbook-box { display: grid; gap: 8px; margin-top: 8px; }
    .playbook-item { background: var(--surface-3); border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px; font-size: 13px; }
    .playbook-lbl { font-weight: 700; font-size: 12px; margin-bottom: 4px; }
  </style>
</head>
<body>
  <!-- Lock Screen -->
  <div id="lock-screen">
    <form class="lock-card" id="unlock-form" autocomplete="on">
      <h2 class="lock-title">🔐 MY_STOCK</h2>
      <p class="lock-sub" id="lock-status-msg">端到端加密保護（AES-256-GCM / IndexedDB 非可匯出金鑰）</p>
      <input type="text" name="username" value="my_stock_vault" autocomplete="username" class="hidden" aria-hidden="true" />
      <input id="passphrase-input" class="lock-input" type="password" name="password"
             placeholder="請輸入解鎖密碼" autocomplete="current-password" required />
      <label class="lock-remember">
        <input id="remember-device" type="checkbox" checked />
        <span>記住此裝置（以非可匯出 CryptoKey 存於本機 IndexedDB，免重複輸入）</span>
      </label>
      <button id="unlock-btn" type="submit" class="lock-btn">解鎖戰情中心</button>
      <div id="lock-error" class="lock-err"></div>
    </form>
  </div>

  <!-- Auto-Privacy Blur Curtain -->
  <div id="privacy-curtain" class="hidden">
    <div class="curtain-box">
      <div style="font-size:28px;margin-bottom:6px;">🛡️</div>
      <div style="font-size:16px;font-weight:700;margin-bottom:4px;">自動防窺保護已啟動</div>
      <div style="font-size:13px;color:var(--text-muted);">點擊任意處立即恢復檢視（無須重輸密碼）</div>
    </div>
  </div>

  <!-- Main App -->
  <div id="app" class="hidden">
    <header class="topbar">
      <div class="topbar-inner">
        <div class="topbar-row">
          <div class="brand">
            <h1>MY_STOCK</h1>
            <span id="phase-badge" class="badge badge-blue"></span>
            <span id="timestamp-meta" style="font-size:12px;color:var(--text-muted);"></span>
          </div>

      <div class="modal-hdr">
        <h3 style="margin:0;font-size:16px;">📜 今日完整盤前戰略書</h3>

  <div id="toast"></div>

  <script>
  (() => {
    "use strict";

    const IDB_NAME = "MyStockKeyVault";
    const IDB_STORE = "keys";
    const IDB_KEY_ID = "master_key";
    const LS_BOSS_KEY = "mystock_boss_mode";
    const LS_PRIVACY_AUTO = "mystock_auto_privacy";
    const LS_FEE_DISCOUNT = "mystock_fee_discount";
    const LS_CHECKLIST_PREFIX = "mystock_checklist_";
    const LS_SETTLE_ACK_PREFIX = "mystock_settle_ack_";

    const state = {
      cryptoKey: null,
      manifest: null,
      latest: null,
      historyPnl: null,
      activeDate: null,
      pool: "all", // all | swing | long_term
      mainView: "battle", // battle | perf
      mobileTab: "battle", // battle | holdings | dca | perf
      gapPct: 0.0,
      priceOverrides: {}, // { stock_id: number }
      selectedStockId: null,
      drawerTab: "t1",
      searchQuery: "",
      sortBy: "priority",
      p3Expanded: false,
      briefExpanded: false,
      macroExpanded: false,
      hiddenSince: null,
      idleTimer: null,
    };

    // ---------- Safe Escaping & Formatting ----------
    function esc(v) {
      if (v === null || v === undefined) return "";
      return String(v)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#39;");
    }

    function fmtNum(n, digits = 0) {
      if (n === null || n === undefined || Number.isNaN(Number(n))) return "--";
      return Number(n).toLocaleString("zh-TW", {
        minimumFractionDigits: digits,
        maximumFractionDigits: digits,
      });
    }

    function fmtMoney(n, signed = false) {
      if (n === null || n === undefined || Number.isNaN(Number(n))) return "--";
      const val = Math.round(Number(n));
      const prefix = signed && val > 0 ? "+" : (val < 0 ? "-" : "");
      return `${prefix}NT$ ${Math.abs(val).toLocaleString("zh-TW")}`;
    }

    function fmtPct(n, signed = true) {
      if (n === null || n === undefined || Number.isNaN(Number(n))) return "--";
      const num = Number(n);
      const s = signed && num > 0 ? "+" : "";
      return `${s}${num.toFixed(2)}%`;
    }

    function clsBySign(n) {
      const v = Number(n || 0);
      if (v > 0) return "up";
      if (v < 0) return "down";
      return "flat";
    }

    function fmtShares(qty) {
      const q = Math.round(Number(qty || 0));
      if (q >= 1000 && q % 1000 === 0) return `${q / 1000}張`;
      return `${q.toLocaleString("zh-TW")}股`;
    }

    function roundTwTick(price, stockId = "") {
      const p = Number(price || 0);
      if (!(p > 0)) return 0;
      const isEtf = String(stockId || "").startsWith("00");
      let tick = 0.01;
      if (isEtf) {
        tick = p < 50 ? 0.01 : 0.05;
      } else if (p < 10) tick = 0.01;
      else if (p < 50) tick = 0.05;
      else if (p < 100) tick = 0.1;
      else if (p < 500) tick = 0.5;
      else if (p < 1000) tick = 1.0;
      else tick = 5.0;
      return Number((Math.round(p / tick) * tick).toFixed(2));
    }

    let toastTimer = null;
    function showToast(msg) {
      const el = document.getElementById("toast");
      el.textContent = msg;
      el.classList.add("show");
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => el.classList.remove("show"), 2200);
    }

    async function copyText(text, label) {
      try {
        await navigator.clipboard.writeText(String(text));
        showToast(label || `已複製：${text}`);
      } catch {
        const ta = document.createElement("textarea");
        ta.value = String(text);
        ta.style.position = "fixed";
        ta.style.opacity = "0";
        document.body.appendChild(ta);
        ta.select();
        document.execCommand("copy");
        document.body.removeChild(ta);
        showToast(label || `已複製：${text}`);
      }
    }

    // ---------- Mode B Web Crypto & IndexedDB ----------
    function b64ToBytes(b64) {
      const bin = atob(b64);
      const out = new Uint8Array(bin.length);
      for (let i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
      return out;
    }

    function openKeyDb() {
      return new Promise((resolve, reject) => {
        const req = indexedDB.open(IDB_NAME, 1);
        req.onupgradeneeded = () => {
          const db = req.result;
          if (!db.objectStoreNames.contains(IDB_STORE)) {
            db.createObjectStore(IDB_STORE, { keyPath: "id" });
          }
        };
        req.onsuccess = () => resolve(req.result);
        req.onerror = () => reject(req.error);
      });
    }

    async function loadCachedKey() {
      const db = await openKeyDb();
      return new Promise((resolve, reject) => {
        const tx = db.transaction(IDB_STORE, "readonly");
        const req = tx.objectStore(IDB_STORE).get(IDB_KEY_ID);
        req.onsuccess = () => resolve(req.result || null);
        req.onerror = () => reject(req.error);
      });
    }

    async function saveCachedKey(cryptoKey, saltB64) {
      const db = await openKeyDb();
      return new Promise((resolve, reject) => {
        const tx = db.transaction(IDB_STORE, "readwrite");
        tx.objectStore(IDB_STORE).put({ id: IDB_KEY_ID, key: cryptoKey, salt: saltB64 });
        tx.oncomplete = () => resolve();
        tx.onerror = () => reject(tx.error);
      });
    }

    async function clearCachedKey() {
      try {
        const db = await openKeyDb();
        await new Promise((resolve) => {
          const tx = db.transaction(IDB_STORE, "readwrite");
          tx.objectStore(IDB_STORE).delete(IDB_KEY_ID);
          tx.oncomplete = () => resolve();
          tx.onerror = () => resolve();
        });
      } catch {}
    }

    async function deriveNonExtractableKey(passphrase, saltB64, iterations) {
      const enc = new TextEncoder();
      const baseKey = await crypto.subtle.importKey(
        "raw", enc.encode(passphrase), "PBKDF2", false, ["deriveKey"]
      );
      return crypto.subtle.deriveKey(
        { name: "PBKDF2", salt: b64ToBytes(saltB64), iterations: Number(iterations || 600000), hash: "SHA-256" },
        baseKey,
        { name: "AES-GCM", length: 256 },
        false, // extractable: false -> 永遠無法匯出原始金鑰位元組
        ["decrypt"]
      );
    }

    async function gunzipBytes(gzBytes) {
      const ds = new DecompressionStream("gzip");
      const stream = new Blob([gzBytes]).stream().pipeThrough(ds);
      const ab = await new Response(stream).arrayBuffer();
      return new TextDecoder("utf-8").decode(ab);
    }

    async function fetchAndDecrypt(relPath, cryptoKey) {
      const resp = await fetch(`./${relPath}`, { cache: "no-store" });
      if (!resp.ok) throw new Error(`HTTP ${resp.status} (${relPath})`);
      const env = await resp.json();
      const expectedAad = `mystock:v1:private/${relPath}`;
      if (env.aad !== expectedAad) throw new Error("AAD mismatch");
      const plainBuf = await crypto.subtle.decrypt(
        { name: "AES-GCM", iv: b64ToBytes(env.iv), additionalData: new TextEncoder().encode(expectedAad) },
        cryptoKey,
        b64ToBytes(env.ct)
      );
      const view = new DataView(plainBuf);
      const gzLen = view.getUint32(0, false);
      if (gzLen <= 0 || 4 + gzLen > plainBuf.byteLength) throw new Error("Invalid padded length");
      const gzSlice = new Uint8Array(plainBuf, 4, gzLen);
      const jsonText = await gunzipBytes(gzSlice);
      return JSON.parse(jsonText);
    }

    async function fetchManifestEnvelope() {
      const resp = await fetch("./data/manifest.enc", { cache: "no-store" });
      if (!resp.ok) throw new Error(`無法讀取加密資料 (${resp.status})`);
      return resp.json();
    }

    async function decryptEnvelopeObj(env, cryptoKey, expectedAad) {
      if (env.aad !== expectedAad) throw new Error("AAD mismatch");
      const plainBuf = await crypto.subtle.decrypt(
        { name: "AES-GCM", iv: b64ToBytes(env.iv), additionalData: new TextEncoder().encode(expectedAad) },
        cryptoKey,
        b64ToBytes(env.ct)
      );
      const gzLen = new DataView(plainBuf).getUint32(0, false);
      const jsonText = await gunzipBytes(new Uint8Array(plainBuf, 4, gzLen));
      return JSON.parse(jsonText);
    }

    // ---------- Local Checklist & Settlement Ack ----------
    function getChecklistKey() {
      const dt = (state.latest && state.latest.trade_date) || "today";
      return `${LS_CHECKLIST_PREFIX}${dt}`;
    }
    function loadChecklist() {
      try { return JSON.parse(localStorage.getItem(getChecklistKey()) || "{}"); } catch { return {}; }
    }
    function toggleChecklist(stockId) {
      const map = loadChecklist();
      map[stockId] = !map[stockId];
      localStorage.setItem(getChecklistKey(), JSON.stringify(map));
      renderBattleQueue();
    }
    function cleanupOldChecklists(curDate) {
      try {
        for (let i = localStorage.length - 1; i >= 0; i--) {
          const k = localStorage.key(i);
          if (k && k.startsWith(LS_CHECKLIST_PREFIX) && k !== `${LS_CHECKLIST_PREFIX}${curDate}`) {
            localStorage.removeItem(k);
          }
        }
      } catch {}
    }

    // ---------- Effective Price & Dynamic Recalculation (Gap Slider + Trial Override) ----------
    function computeEffectiveHolding(h) {
      const baseClose = Number(h.latest_close || 0);
      const beta = Number(h.beta_60d || 1.0);
      const hasOverride = Object.prototype.hasOwnProperty.call(state.priceOverrides, h.stock_id);
      let effPrice = baseClose;
      let isSimulated = false;
      if (hasOverride) {
        effPrice = Number(state.priceOverrides[h.stock_id]);
        isSimulated = true;
      } else if (state.gapPct !== 0 && baseClose > 0) {
        effPrice = roundTwTick(baseClose * (1 + (state.gapPct / 100) * beta), h.stock_id);
        isSimulated = true;
      }
      const qty = Number(h.qty || 0);
      const costBasis = Number(h.cost_basis || (qty * Number(h.avg_cost || 0)));
      const mv = Math.round(qty * effPrice);
      const upnl = mv - costBasis;
      const upct = costBasis > 0 ? Number(((upnl / costBasis) * 100).toFixed(2)) : 0;

      const mem = h.memory || null;
      const stopPx = mem ? Number(mem.trailing_stop || mem.initial_sl || 0) : 0;
      const tp1Px = mem ? Number(mem.initial_tp1 || 0) : 0;
      const tp2Px = mem ? Number(mem.initial_tp2 || 0) : 0;
      const toStopPct = (stopPx > 0 && effPrice > 0) ? Number((((stopPx - effPrice) / effPrice) * 100).toFixed(2)) : null;
      const toTp1Pct = (tp1Px > 0 && effPrice > 0) ? Number((((tp1Px - effPrice) / effPrice) * 100).toFixed(2)) : null;
      const toTp2Pct = (tp2Px > 0 && effPrice > 0) ? Number((((tp2Px - effPrice) / effPrice) * 100).toFixed(2)) : null;

      // Dynamic priority promotion under trial / gap simulation
      let effPriority = h.priority_tier || "P3";
      let simAlert = "";
      if (isSimulated && mem) {
        if (stopPx > 0 && effPrice <= stopPx) {
          effPriority = "P0";
          simAlert = `⚡ 模擬價跌破防守 ${stopPx}`;
        } else if (tp2Px > 0 && effPrice >= tp2Px * 0.995) {
          effPriority = "P1";
          simAlert = `⚡ 模擬價達 TP2 ${tp2Px}`;
        } else if (mem.status === "OPEN" && tp1Px > 0 && effPrice >= tp1Px * 0.99) {
          effPriority = "P1";
          simAlert = `⚡ 模擬價達 TP1 ${tp1Px}`;
        } else if (mem.tier_blueprint) {
          const tb = mem.tier_blueprint;
          const t2p = tb.tier2 && tb.tier2.price ? Number(tb.tier2.price) : 0;
          const t3p = tb.tier3 && tb.tier3.price ? Number(tb.tier3.price) : 0;
          if ((t3p > 0 && effPrice <= t3p * 1.005) || (t2p > 0 && !tb.tier2.filled && effPrice <= t2p * 1.005)) {
            if (effPriority === "P3") effPriority = "P2";
            simAlert = `⚡ 模擬價進入低接區`;
          }
        }
      }

      return {
        ...h,
        effPrice,
        hasOverride,
        isSimulated,
        effMarketValue: mv,
        effUnrealizedPnl: upnl,
        effUnrealizedPct: upct,
        effToStopPct: toStopPct,
        effToTp1Pct: toTp1Pct,
        effToTp2Pct: toTp2Pct,
        effPriority,
        simAlert,
      };
    }

    function getFilteredHoldings() {
      const raw = (state.latest && state.latest.holdings) || [];
      return raw.map(computeEffectiveHolding).filter((h) => {
        if (state.pool === "swing" && h.pool_type !== "SWING") return false;
        if (state.pool === "long_term" && h.pool_type !== "LONG_TERM") return false;
        return true;
      });
    }

    // ---------- Renderers ----------
    function renderTopMeta() {
      const d = state.latest;
      if (!d) return;
      const phaseLabels = {
        MORNING_BRIEF: "☀️ 盤前作戰模式",
        DCA_0050_EVAL: "📈 0050 已評估",
        MEMORY_SYNC: "🌙 盤後記憶已校準",
        MANUAL_PUBLISH: "⚡ 手動即時同步",
      };
      const pb = document.getElementById("phase-badge");
      pb.textContent = phaseLabels[d.phase] || d.phase || "READY";
      document.getElementById("timestamp-meta").textContent =
        `價格基準日：${d.price_as_of_date || "--"} ｜ 更新：${(d.generated_at || "").replace("T", " ").slice(0, 16)}`;

      // Stale data warning on weekday
      const staleEl = document.getElementById("stale-banner");
      const nowTw = new Date(new Date().toLocaleString("en-US", { timeZone: "Asia/Taipei" }));
      const todayIso = `${nowTw.getFullYear()}-${String(nowTw.getMonth() + 1).padStart(2, "0")}-${String(nowTw.getDate()).padStart(2, "0")}`;
      const isWeekday = nowTw.getDay() >= 1 && nowTw.getDay() <= 5;
      if (isWeekday && d.trade_date && d.trade_date < todayIso && state.activeDate === null) {
        staleEl.textContent = `⚠️ 目前顯示為歷史快照（交易日 ${d.trade_date}，非今日 ${todayIso}），下單前請確認最新盤勢與排程狀態。`;
        staleEl.classList.remove("hidden");
      } else if (state.activeDate && state.manifest && state.activeDate !== state.manifest.latest_trade_date) {
        staleEl.textContent = `📅 歷史回顧模式：目前正檢視 ${state.activeDate} 晨報快照（切回下拉選單第一項可回到最新資料）。`;
        staleEl.classList.remove("hidden");
      } else {
        staleEl.classList.add("hidden");
      }

      // Settlement 3-slot bar
      const st = d.settlement || {};
      const t2 = Number(st.t_plus_2_due_today || 0);
      const t1 = Number(st.t_plus_1_due_tomorrow || 0);
      const t0 = Number(st.t_plus_0_due_day_after || 0);

    function appendInlineMd(parent, text) {
      const tokenRe = /(\*\*[^*]+\*\*|`[^`]+`)/g;
      let lastIdx = 0;
      let m;
      while ((m = tokenRe.exec(text)) !== null) {
        if (m.index > lastIdx) {
          parent.appendChild(document.createTextNode(text.slice(lastIdx, m.index)));
        }
        const tok = m[0];
        if (tok.startsWith("**") && tok.endsWith("**")) {
          const strong = document.createElement("strong");
          strong.appendChild(document.createTextNode(tok.slice(2, -2)));
          parent.appendChild(strong);
        } else if (tok.startsWith("`") && tok.endsWith("`")) {
          const code = document.createElement("code");
          code.appendChild(document.createTextNode(tok.slice(1, -1)));
          parent.appendChild(code);
        }
        lastIdx = tokenRe.lastIndex;
      }
      if (lastIdx < text.length) {
        parent.appendChild(document.createTextNode(text.slice(lastIdx)));
      }
    }

    function renderSafeMarkdown(container, mdText) {
      container.textContent = "";
      const root = document.createElement("div");
      root.className = "md-body";
      const lines = String(mdText || "").replace(/\r\n/g, "\n").split("\n");
      let i = 0;
      let ul = null;
      const closeList = () => { if (ul) { root.appendChild(ul); ul = null; } };
      while (i < lines.length) {
        const raw = lines[i];
        const trim = raw.trim();
        if (!trim) { closeList(); i++; continue; }
        if (/^---+$/.test(trim)) {
          closeList();
          root.appendChild(document.createElement("hr"));
          i++; continue;
        }
        const hMatch = trim.match(/^(#{1,4})\s+(.*)$/);
        if (hMatch) {
          closeList();
          const h = document.createElement("h" + hMatch[1].length);
          appendInlineMd(h, hMatch[2]);
          root.appendChild(h);
          i++; continue;
        }
        if (trim.startsWith("|") && i + 1 < lines.length && /^\|[\s:|-]+\|/.test(lines[i + 1].trim())) {
          closeList();
          const tbl = document.createElement("table");
          const thead = document.createElement("thead");
          const trH = document.createElement("tr");
          trim.split("|").slice(1, -1).forEach((c) => {
            const th = document.createElement("th");
            appendInlineMd(th, c.trim());
            trH.appendChild(th);
          });
          thead.appendChild(trH);
          tbl.appendChild(thead);
          const tbody = document.createElement("tbody");
          i += 2;
          while (i < lines.length && lines[i].trim().startsWith("|")) {
            const tr = document.createElement("tr");
            lines[i].trim().split("|").slice(1, -1).forEach((c) => {
              const td = document.createElement("td");
              appendInlineMd(td, c.trim());
              tr.appendChild(td);
            });
            tbody.appendChild(tr);
            i++;
          }
          tbl.appendChild(tbody);
          root.appendChild(tbl);
          continue;
        }
        if (trim.startsWith("> ")) {
          closeList();
          const bq = document.createElement("blockquote");
          appendInlineMd(bq, trim.slice(2));
          root.appendChild(bq);
          i++; continue;
        }
        const liMatch = trim.match(/^(?:[-*•]|\d+\.)\s+(.*)$/);
        if (liMatch) {
          if (!ul) ul = document.createElement("ul");
          const li = document.createElement("li");
          appendInlineMd(li, liMatch[1]);
          ul.appendChild(li);
          i++; continue;
        }
        closeList();
        const p = document.createElement("p");
        appendInlineMd(p, trim);
        root.appendChild(p);
        i++;
      }
      closeList();
      container.appendChild(root);
    }

    function buildSmileCurveSvg(points) {
      if (!points || points.length < 2) {
        return `<div style="font-size:12px;color:var(--text-dim);padding:10px;text-align:center;border:1px dashed var(--border);border-radius:8px;">累積至少 2 週 0050 紀錄後自動繪製近 12 週微笑曲線</div>`;
      }
      const W = 500, H = 140, padL = 38, padR = 12, padT = 14, padB = 22;
      const vals = [];
      points.forEach((p) => {
        if (p.price > 0) vals.push(p.price);
        if (p.avg_cost > 0) vals.push(p.avg_cost);
      });
      const minV = Math.min(...vals) * 0.99;
      const maxV = Math.max(...vals) * 1.01;
      const span = Math.max(0.01, maxV - minV);
      const xOf = (i) => padL + (i / (points.length - 1)) * (W - padL - padR);
      const yOf = (v) => padT + (1 - (v - minV) / span) * (H - padT - padB);

      const pricePath = points.map((p, i) => `${i === 0 ? "M" : "L"}${xOf(i).toFixed(1)},${yOf(p.price).toFixed(1)}`).join(" ");
      const avgPts = points.map((p, i) => p.avg_cost > 0 ? { x: xOf(i), y: yOf(p.avg_cost) } : null).filter(Boolean);
      const avgPath = avgPts.map((pt, i) => `${i === 0 ? "M" : "L"}${pt.x.toFixed(1)},${pt.y.toFixed(1)}`).join(" ");
      const dots = points.map((p, i) => p.bought ? `<circle cx="${xOf(i).toFixed(1)}" cy="${yOf(p.price).toFixed(1)}" r="4" fill="#10b981" stroke="#fff" stroke-width="1.5"/>` : "").join("");

      return `
        <svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;background:var(--surface-3);border-radius:8px;border:1px solid var(--border);">
          <text x="${padL}" y="12" fill="#94a3b8" font-size="10">近 12 週 0050 市價 (藍) vs 累計均價 (橘虛線) ｜ 綠點=買進</text>
          <path d="${pricePath}" fill="none" stroke="#3b82f6" stroke-width="2"/>
          ${avgPath ? `<path d="${avgPath}" fill="none" stroke="#f59e0b" stroke-width="1.8" stroke-dasharray="4 3"/>` : ""}
          ${dots}
          <text x="4" y="${padT + 8}" fill="#64748b" font-size="10">${maxV.toFixed(1)}</text>
          <text x="4" y="${H - padB}" fill="#64748b" font-size="10">${minV.toFixed(1)}</text>
          <text x="${padL}" y="${H - 5}" fill="#64748b" font-size="10">${esc(points[0].week)}</text>
          <text x="${W - padR - 48}" y="${H - 5}" fill="#64748b" font-size="10">${esc(points[points.length - 1].week)}</text>
        </svg>
      `;
    }

        ${(h.intraday_playbook && (h.intraday_playbook.bull_scenario || h.intraday_playbook.pullback_scenario || h.intraday_playbook.next_day_watch)) ? `

              ${h.intraday_playbook.pullback_scenario ? `<div class="playbook-item"><div class="playbook-lbl" style="color:var(--green-text);">🛡️ 遇壓拉回／回補情境</div><div>${esc(h.intraday_playbook.pullback_scenario)}</div></div>` : ""}
              ${h.intraday_playbook.next_day_watch ? `<div class="playbook-item"><div class="playbook-lbl" style="color:var(--amber-text);">🔭 盤後檢驗點與明日預告</div><div>${esc(h.intraday_playbook.next_day_watch)}</div></div>` : ""}
            </div>
          </div>
        ` : ""}
        ${calcHtml}
      `;

      const runCalc = () => {
        const mode = document.getElementById("calc-mode").value;
        const px = Number(document.getElementById("calc-price").value || 0);
        const q = Number(document.getElementById("calc-qty").value || 0);
        const disc = Math.max(0.01, Math.min(1, Number(document.getElementById("calc-disc").value || 0.28)));
        localStorage.setItem(LS_FEE_DISCOUNT, String(disc));
        const out = document.getElementById("calc-output");
        if (!(px > 0 && q > 0)) { out.textContent = "請輸入有效模擬價格與股數"; return; }
        const gross = px * q;
        const fee = Math.max(1, Math.round(gross * 0.001425 * disc));
        const taxRate = h.stock_id.startsWith("00") ? 0.001 : 0.003;
        if (mode === "sell") {
          const tax = Math.round(gross * taxRate);
          const buyFeeEst = Math.max(1, Math.round((h.avg_cost * q) * 0.001425 * disc));
          const netPnl = Math.round(gross - fee - tax - (h.avg_cost * q + buyFeeEst));
          const retPct = (h.avg_cost * q) > 0 ? (netPnl / (h.avg_cost * q)) * 100 : 0;
          out.innerHTML = `賣出金額 <span class="money">${fmtMoney(gross)}</span> ｜ 手續費 ${fee} + 證交稅(${(taxRate*100).toFixed(1)}%) ${tax} ➔ 預估淨損益 <strong class="money ${clsBySign(netPnl)}">${fmtMoney(netPnl, true)}</strong> (<strong class="${clsBySign(retPct)}">${fmtPct(retPct)}</strong>)`;
        } else {
          const newQty = h.qty + q;
          const newCost = (h.cost_basis + gross + fee);
          const newAvg = newQty > 0 ? newCost / newQty : 0;
          const bePx = roundTwTick(newAvg * (1 + taxRate + 0.00285 * disc), h.stock_id);
          out.innerHTML = `加碼後總股數 <strong class="money">${fmtShares(newQty)}</strong> ｜ 預估投入 <span class="money">${fmtMoney(gross + fee)}</span> ｜ <strong>新均價 ${fmtNum(newAvg, 2)} 元</strong> ｜ 新損益兩平價 <strong>${fmtNum(bePx, 2)} 元</strong>`;
        }
      };
      ["calc-mode", "calc-price", "calc-qty", "calc-disc"].forEach((id) => {
        document.getElementById(id).addEventListener("input", runCalc);
      });
      runCalc();
    }

    // ---------- Order Ticket Modal (Static Buy vs Sell Totals per User Decision) ----------
    function openOrderTicketModal() {
      const d = state.latest;
      if (!d) return;
      const tickets = (d.holdings || [])
        .map(computeEffectiveHolding)
        .filter((h) => h.order_ticket);

      const groups = [
        { code: "STOP_LOSS", title: "🔴 停損 / 邏輯失效減碼單" },
        { code: "TAKE_PROFIT", title: "🟢 風格 B 停利鎖利單" },
        { code: "DIP_ADD", title: "🟡 低接 / 子彈加碼掛單" },
        { code: "TRIM_SWAP", title: "🔄 趁彈減碼換股單" },
      ];

      let buyTotal = 0, sellTotal = 0;
      const plainMemoLines = [`[MY_STOCK 今日掛單備忘 ${d.trade_date || ""}]`];

      const bodyHtml = !tickets.length
        ? `<div class="alert-bar alert-green">🟢 今日無 P0～P2 建議掛單，全數續抱即可。</div>`
        : groups.map((g) => {
            const list = tickets.filter((h) => h.order_ticket.group === g.code);
            if (!list.length) return "";
            return `
              <div style="margin-bottom:14px;">
                <div style="font-weight:700;font-size:13.5px;margin-bottom:6px;">${g.title}</div>
                ${list.map((h) => {
                  const tk = h.order_ticket;
                  const px = roundTwTick(tk.ref_price, h.stock_id);
                  const gross = Math.round(px * tk.suggested_qty);
                  if (tk.side === "BUY") buyTotal += gross;
                  else sellTotal += gross;
                  plainMemoLines.push(`${tk.side === "BUY" ? "買" : "賣"} ${h.stock_id} ${h.stock_name} ${fmtShares(tk.suggested_qty)} @ ${px} (${tk.order_type === "BOARD_LOT" ? "整張" : "盤中零股"})`);
                  return `
                    <div style="display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 10px;background:var(--surface-3);border:1px solid var(--border);border-radius:8px;margin-bottom:6px;">
                      <div>
                        <strong>${esc(h.stock_id)} ${esc(h.stock_name)}</strong>
                        <span class="badge badge-muted">${tk.order_type === "BOARD_LOT" ? "現股整張" : "盤中零股"}</span>
                        <span class="num money" style="margin-left:6px;">${tk.side === "BUY" ? "買進" : "賣出"} ${fmtShares(tk.suggested_qty)}</span>
                        <div style="font-size:11.5px;color:var(--text-muted);margin-top:2px;">${esc(tk.note || "")}</div>
                      </div>
                      <button class="copy-chip num" data-copy-price="${px}" data-copy-label="${esc(h.stock_id)} 委託價 ${px}">📋 ${fmtNum(px, 2)}</button>
                    </div>
                  `;
                }).join("")}
              </div>
            `;
          }).join("");

      const netDiff = sellTotal - buyTotal;
      document.getElementById("ticket-body").innerHTML = bodyHtml;
      document.getElementById("ticket-footer").innerHTML = `
        <div style="display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:10px;">
          <div class="num" style="font-size:13px;">
            📊 建議買單總額：<strong class="money">${fmtMoney(buyTotal)}</strong> ｜
            建議賣單總額：<strong class="money">${fmtMoney(sellTotal)}</strong> ｜
            相抵預估淨額：<strong class="money ${clsBySign(netDiff)}">${fmtMoney(netDiff, true)}</strong>
          </div>
          <button id="btn-copy-memo" class="btn btn-primary">📄 複製純文字作戰備忘</button>
        </div>
      `;
      document.getElementById("btn-copy-memo").addEventListener("click", () => {
        copyText(plainMemoLines.join("\n"), "已複製純文字作戰備忘（不含總資產金額）");
      });
      document.getElementById("ticket-modal").classList.remove("hidden");
    }

                <div style="position:absolute;left:35%;top:0;bottom:0;border-left:1.5px dashed #fbbf24;" title="35% 警戒線"></div>
              </div>
            </div>`;
          }).join("")}
        </div>
      `;
      document.getElementById("sector-heatmap-card").innerHTML = `
        <h3 class="section-title" style="margin-bottom:10px;">🧩 庫存次產業集中度（黃虛線 = 35% 警戒）</h3>
        ${secHtml}
      `;

      document.getElementById("corr-matrix-card").innerHTML = `
        <h3 class="section-title" style="margin-bottom:10px;">🔗 60 日共伴相關性高連動警示 (Corr ≥ 0.70)</h3>
        ${!pairs.length ? `<div class="alert-bar alert-green">🟢 目前持股間無 60 日高度共伴配對（分散度良好）。</div>` : `
          <div style="display:flex;flex-direction:column;gap:6px;">
            ${pairs.map((p) => `
              <div style="display:flex;justify-content:space-between;padding:8px 10px;background:var(--surface-3);border:1px solid ${p.corr_60d >= 0.8 ? "rgba(239,68,68,0.45)" : "rgba(245,158,11,0.4)"};border-radius:8px;font-size:13px;">
                <span>${esc(p.stock_a)} ${esc(p.name_a)} ⇄ ${esc(p.stock_b)} ${esc(p.name_b)}</span>
                <strong class="num ${p.corr_60d >= 0.8 ? "up" : ""}">Corr = ${p.corr_60d.toFixed(2)}</strong>
              </div>
            `).join("")}
          </div>
        `}
      `;

      // Lazy load history_pnl.enc
      const root = document.getElementById("history-pnl-root");
      if (!state.historyPnl) {
        root.textContent = "正在解密載入歷史復盤帳本 (history_pnl.enc)...";
        try {
          state.historyPnl = await fetchAndDecrypt("data/history_pnl.enc", state.cryptoKey);
        } catch (err) {
          root.innerHTML = `<div class="alert-bar alert-amber">尚無歷史已實現損益冷資料包（待首次盤後同步或手動發布後自動生成）。</div>`;
          return;
        }
      }
      const hp = state.historyPnl;
      const ds = hp.discipline_stats || {};
      const lvs = hp.live_vs_system || {};
      const sys = lvs.system_top_pick || {};
      const months = hp.monthly_pnl || [];
      const waves = hp.closed_waves || [];

      root.innerHTML = `
        <h3 class="section-title" style="margin-bottom:12px;">🏆 知行合一執行紀律 &amp; 實盤 vs 系統回測對照</h3>
        <div class="kpi-grid" style="margin-bottom:16px;">
          <div class="card" style="background:var(--surface-3);">
            <div class="kpi-label">綜合紀律執行率</div>
            <div class="kpi-val num">${fmtNum(ds.compliance_pct ?? 100, 1)}%</div>
            <div class="kpi-sub">達標 ${ds.compliant_events || 0} / ${ds.actionable_events || 0} 次事件</div>
          </div>
          <div class="card" style="background:var(--surface-3);">
            <div class="kpi-label">停損紀律 / 凹單次數</div>
            <div class="kpi-val num">${ds.stop_execution_rate_pct != null ? `${ds.stop_execution_rate_pct}%` : "無觸發"}</div>
            <div class="kpi-sub">破線未砍次數：<strong class="${(ds.unexecuted_stop_count || 0) > 0 ? "up" : ""}">${ds.unexecuted_stop_count || 0} 次</strong></div>
          </div>
          <div class="card" style="background:var(--surface-3);">
            <div class="kpi-label">實盤已平倉勝率 / PF</div>
            <div class="kpi-val num">${fmtNum(lvs.live_win_rate_pct || 0, 1)}%</div>
            <div class="kpi-sub">已平倉 ${lvs.live_closed_count || 0} 筆 ｜ PF ${fmtNum(lvs.live_profit_factor || 0, 2)}</div>
          </div>
          <div class="card" style="background:var(--surface-3);">
            <div class="kpi-label">系統 TOP_PICK 理論勝率</div>
            <div class="kpi-val num">${sys.available ? `${fmtNum(sys.win_rate_pct, 1)}%` : "--"}</div>
            <div class="kpi-sub">${sys.available ? `樣本 ${sys.settled_trades} 筆 ｜ PF ${fmtNum(sys.profit_factor, 2)}` : "尚無已結算審計樣本"}</div>
          </div>
        </div>

        <h3 class="section-title" style="margin:14px 0 8px;">📊 月度已實現損益 &amp; 累計曲線</h3>
        ${buildMonthlyPnlSvg(months)}

        <h3 class="section-title" style="margin:16px 0 8px;">📒 歷史已平倉波段復盤帳本（${waves.length} 筆）</h3>
        ${!waves.length ? `<div style="color:var(--text-muted);font-size:13px;">尚無已平倉之波段記憶卡。</div>` : `
          <div class="table-wrap">
            <table>
              <thead><tr><th>標的</th><th>策略來源</th><th>持有天數</th><th>風格 B</th><th>已實現損益</th><th>建倉理由</th></tr></thead>
              <tbody>
                ${waves.map((w) => `
                  <tr>
                    <td><strong>${esc(w.stock_id)} ${esc(w.stock_name)}</strong><div style="font-size:11px;color:var(--text-dim);">${esc(w.opened_date)} ~ ${esc(w.closed_date)}</div></td>
                    <td><span class="badge badge-muted">${esc(w.source_strategy)}</span></td>
                    <td class="num">${w.holding_days} 天</td>
                    <td>${w.style_b_partial_taken ? "✅ 已賣半" : "—"}</td>
                    <td class="num"><strong class="money ${clsBySign(w.realized_pnl)}">${fmtMoney(w.realized_pnl, true)}</strong><div class="${clsBySign(w.return_pct)}" style="font-size:11.5px;">${fmtPct(w.return_pct)}</div></td>
                    <td style="font-size:12px;color:var(--text-muted);max-width:260px;">${esc((w.entry_thesis || "").slice(0, 90))}</td>
                  </tr>
                `).join("")}
              </tbody>
            </table>
          </div>
        `}
      `;
    }

    function buildMonthlyPnlSvg(months) {
      if (!months || !months.length) {
        return `<div style="color:var(--text-dim);font-size:12.5px;padding:12px;border:1px dashed var(--border);border-radius:8px;">尚無月度已實現損益紀錄</div>`;
      }
      const recent = months.slice(-12);
      const W = 720, H = 180, padL = 56, padR = 20, padT = 18, padB = 26;
      const allV = [0];
      recent.forEach((m) => { allV.push(m.realized_pnl, m.cumulative_pnl); });
      const minV = Math.min(...allV);
      const maxV = Math.max(...allV);
      const span = Math.max(1, maxV - minV);
      const yOf = (v) => padT + (1 - (v - minV) / span) * (H - padT - padB);
      const y0 = yOf(0);
      const step = (W - padL - padR) / recent.length;
      const bw = Math.max(10, step * 0.48);

      const bars = recent.map((m, i) => {
        const cx = padL + step * (i + 0.5);
        const yv = yOf(m.realized_pnl);
        const top = Math.min(y0, yv);
        const bh = Math.max(2, Math.abs(yv - y0));
        const fill = m.realized_pnl >= 0 ? "#ef4444" : "#10b981";
        return `<rect x="${(cx - bw / 2).toFixed(1)}" y="${top.toFixed(1)}" width="${bw.toFixed(1)}" height="${bh.toFixed(1)}" rx="3" fill="${fill}" opacity="0.78"/>
                <text x="${cx.toFixed(1)}" y="${H - 7}" text-anchor="middle" fill="#94a3b8" font-size="10">${esc(m.month.slice(2))}</text>`;
      }).join("");

      const linePath = recent.map((m, i) => {
        const cx = padL + step * (i + 0.5);
        return `${i === 0 ? "M" : "L"}${cx.toFixed(1)},${yOf(m.cumulative_pnl).toFixed(1)}`;
      }).join(" ");

      return `
        <svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;background:var(--surface-3);border:1px solid var(--border);border-radius:10px;">
          <line x1="${padL}" y1="${y0.toFixed(1)}" x2="${W - padR}" y2="${y0.toFixed(1)}" stroke="#334155" stroke-dasharray="3 3"/>
          ${bars}
          <path d="${linePath}" fill="none" stroke="#60a5fa" stroke-width="2.2"/>
          <text x="${padL}" y="13" fill="#94a3b8" font-size="10.5">柱狀：月度損益（紅賺/綠虧）｜ 藍線：累計已實現損益</text>
        </svg>
      `;
    }

    function applyMobileAndMainView() {
      const isMobile = window.innerWidth <= 768;
      const battleWrap = document.getElementById("view-battle-wrap");
      const perfWrap = document.getElementById("view-perf-wrap");
      const secKpi = document.getElementById("sec-kpi");
      const secQueue = document.getElementById("sec-queue");
      const secHoldings = document.getElementById("sec-holdings");
      const secZone5 = document.getElementById("sec-zone5");

      if (isMobile) {
        if (state.mobileTab === "perf") {
          battleWrap.classList.add("hidden");
          perfWrap.classList.remove("hidden");
          renderPerfAndRisk();
        } else {
          battleWrap.classList.remove("hidden");
          perfWrap.classList.add("hidden");
          secKpi.classList.toggle("hidden", state.mobileTab !== "battle");
          secQueue.classList.toggle("hidden", state.mobileTab !== "battle");
          secHoldings.classList.toggle("hidden", state.mobileTab !== "holdings");
          secZone5.classList.toggle("hidden", state.mobileTab !== "dca");
        }
        document.querySelectorAll(".mnav-btn").forEach((b) => b.classList.toggle("active", b.dataset.mtab === state.mobileTab));
      } else {
        secKpi.classList.remove("hidden");
        secQueue.classList.remove("hidden");
        secHoldings.classList.remove("hidden");
        secZone5.classList.remove("hidden");
        const isPerf = state.mainView === "perf";
        battleWrap.classList.toggle("hidden", isPerf);
        perfWrap.classList.toggle("hidden", !isPerf);
        document.querySelectorAll("[data-main-view]").forEach((b) => {
          b.classList.toggle("btn-primary", b.dataset.mainView === state.mainView);
        });
        if (isPerf) renderPerfAndRisk();
      }
    }

    function renderAll() {
      renderTopMeta();
      renderKpis();
      renderBattleQueue();
      renderHoldingsTable();
      renderZone5();
      if (state.selectedStockId) renderDrawer();
      applyMobileAndMainView();
    }

    function populateHistoryDropdown() {
      const sel = document.getElementById("history-date-select");
      const dates = (state.manifest && state.manifest.available_daily_dates) || [];
      sel.innerHTML = `<option value="">📅 最新快照 (${esc((state.manifest && state.manifest.latest_trade_date) || "")})</option>` +
        dates.map((dt) => `<option value="${esc(dt)}" ${state.activeDate === dt ? "selected" : ""}>${esc(dt)}</option>`).join("");
    }

    // ---------- App Boot & Unlock Flow ----------
    async function enterAppWithKey(cryptoKey, manifestObj) {
      state.cryptoKey = cryptoKey;
      state.manifest = manifestObj;
      state.latest = await fetchAndDecrypt("data/latest.enc", cryptoKey);
      state.activeDate = null;
      state.historyPnl = null;
      cleanupOldChecklists(state.latest.trade_date || "");

      document.getElementById("lock-screen").classList.add("hidden");
      document.getElementById("app").classList.remove("hidden");
      document.getElementById("mobile-nav").classList.remove("hidden");
      populateHistoryDropdown();
      renderAll();
      setupAutoPrivacy();
    }

    async function tryAutoUnlock() {
      const statusEl = document.getElementById("lock-status-msg");
      try {
        const cached = await loadCachedKey();
        if (!cached || !cached.key) return;
        statusEl.textContent = "偵測到本機金鑰，正在自動解密...";
        const env = await fetchManifestEnvelope();
        if (cached.salt && env.salt !== cached.salt) {
          await clearCachedKey();
          statusEl.textContent = "偵測到金鑰已輪換，請輸入新密碼解鎖";
          return;
        }
        const manifestObj = await decryptEnvelopeObj(env, cached.key, "mystock:v1:private/data/manifest.enc");
        await enterAppWithKey(cached.key, manifestObj);
      } catch {
        await clearCachedKey();
        statusEl.textContent = "端到端加密保護（請輸入解鎖密碼）";
      }
    }

    document.getElementById("unlock-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const input = document.getElementById("passphrase-input");
      const errEl = document.getElementById("lock-error");
      const btn = document.getElementById("unlock-btn");
      const remember = document.getElementById("remember-device").checked;
      const pw = input.value;
      if (!pw) return;

      errEl.textContent = "";
      btn.disabled = true;
      btn.textContent = "正在衍生金鑰並驗證 (PBKDF2 600K)...";
      const t0 = performance.now();
      try {
        const env = await fetchManifestEnvelope();
        const key = await deriveNonExtractableKey(pw, env.salt, env.iter);
        const manifestObj = await decryptEnvelopeObj(env, key, "mystock:v1:private/data/manifest.enc");
        if (remember) await saveCachedKey(key, env.salt);
        input.value = "";
        await enterAppWithKey(key, manifestObj);
      } catch {
        const elapsed = performance.now() - t0;
        if (elapsed < 800) await new Promise((r) => setTimeout(r, 800 - elapsed));
        input.value = "";
        errEl.textContent = "密碼錯誤或金鑰已輪換";
      } finally {
        btn.disabled = false;
        btn.textContent = "解鎖戰情中心";
      }
    });

    // ---------- Privacy / Boss Key / Auto-Blur ----------
    function applyBossMode(on) {
      document.body.classList.toggle("boss-mode", !!on);
      document.getElementById("btn-boss-key").classList.toggle("btn-active", !!on);
      localStorage.setItem(LS_BOSS_KEY, on ? "1" : "0");
    }
    applyBossMode(localStorage.getItem(LS_BOSS_KEY) === "1");

    function updatePrivacyBtn() {
      const on = localStorage.getItem(LS_PRIVACY_AUTO) === "1";
      document.getElementById("btn-privacy-toggle").classList.toggle("btn-active", on);
    }
    updatePrivacyBtn();

    function showPrivacyCurtain() {
      if (document.getElementById("app").classList.contains("hidden")) return;
      document.getElementById("privacy-curtain").classList.remove("hidden");
    }
    document.getElementById("privacy-curtain").addEventListener("click", () => {
      document.getElementById("privacy-curtain").classList.add("hidden");
      resetIdleTimer();
    });

    function resetIdleTimer() {
      clearTimeout(state.idleTimer);
      if (localStorage.getItem(LS_PRIVACY_AUTO) === "1") {
        state.idleTimer = setTimeout(showPrivacyCurtain, 5 * 60 * 1000);
      }
    }

    function setupAutoPrivacy() {
      document.addEventListener("visibilitychange", () => {
        if (localStorage.getItem(LS_PRIVACY_AUTO) !== "1") return;
        if (document.visibilityState === "hidden") {
          state.hiddenSince = Date.now();
        } else if (state.hiddenSince && Date.now() - state.hiddenSince >= 60 * 1000) {
          showPrivacyCurtain();
          state.hiddenSince = null;
        }
      });
      ["mousemove", "keydown", "touchstart", "scroll"].forEach((ev) => {
        window.addEventListener(ev, resetIdleTimer, { passive: true });
      });
      resetIdleTimer();
    }

    // ---------- Event Wiring ----------
    document.getElementById("btn-boss-key").addEventListener("click", () => {
      applyBossMode(!document.body.classList.contains("boss-mode"));
    });
    document.getElementById("btn-privacy-toggle").addEventListener("click", () => {
      const next = localStorage.getItem(LS_PRIVACY_AUTO) !== "1";
      localStorage.setItem(LS_PRIVACY_AUTO, next ? "1" : "0");
      updatePrivacyBtn();
      resetIdleTimer();
      showToast(next ? "🛡️ 已開啟自動防窺（離開60秒或閒置5分鐘自動遮罩）" : "已關閉自動防窺保護");
    });
    document.getElementById("btn-order-ticket").addEventListener("click", openOrderTicketModal);
    document.getElementById("btn-close-ticket").addEventListener("click", () => {
      document.getElementById("ticket-modal").classList.add("hidden");
    });
    document.getElementById("ticket-modal").addEventListener("click", (e) => {
      if (e.target.id === "ticket-modal") document.getElementById("ticket-modal").classList.add("hidden");
    });
    document.getElementById("btn-close-strategy").addEventListener("click", () => {
      document.getElementById("strategy-modal").classList.add("hidden");
    });
    document.getElementById("strategy-modal").addEventListener("click", (e) => {
      if (e.target.id === "strategy-modal") document.getElementById("strategy-modal").classList.add("hidden");
    });
    document.getElementById("drawer-backdrop").addEventListener("click", (e) => {
      if (e.target.id === "drawer-backdrop") closeDrawer();
    });
    document.getElementById("btn-lock").addEventListener("click", async () => {
      await clearCachedKey();
      state.cryptoKey = null;
      state.latest = null;
      state.manifest = null;
      state.historyPnl = null;
      location.reload();
    });
    document.getElementById("btn-refresh").addEventListener("click", async () => {
      if (!state.cryptoKey) return;
      try {
        const env = await fetchManifestEnvelope();
        state.manifest = await decryptEnvelopeObj(env, state.cryptoKey, "mystock:v1:private/data/manifest.enc");
        state.latest = await fetchAndDecrypt("data/latest.enc", state.cryptoKey);
        state.activeDate = null;
        state.historyPnl = null;
        populateHistoryDropdown();
        renderAll();
        showToast("🔄 已重新載入最新加密資料");
      } catch {
        showToast("⚠️ 重整失敗，若已輪換金鑰請重新上鎖登入");
      }
    });
    document.getElementById("history-date-select").addEventListener("change", async (e) => {
      const dt = e.target.value;
      if (!state.cryptoKey) return;
      try {
        if (!dt) {
          state.latest = await fetchAndDecrypt("data/latest.enc", state.cryptoKey);
          state.activeDate = null;
        } else {
          state.latest = await fetchAndDecrypt(`data/daily/${dt}.enc`, state.cryptoKey);
          state.activeDate = dt;
        }
        state.priceOverrides = {};
        state.gapPct = 0;
        document.getElementById("gap-slider").value = "0";
        document.getElementById("gap-val").textContent = "0.0%";
        renderAll();
      } catch {
        showToast(`⚠️ 無法載入 ${dt} 歷史快照`);
      }
    });
    document.getElementById("gap-slider").addEventListener("input", (e) => {
      state.gapPct = Number(e.target.value || 0);
      document.getElementById("gap-val").textContent = fmtPct(state.gapPct);
      renderAll();
    });
    document.getElementById("btn-gap-reset").addEventListener("click", () => {
      state.gapPct = 0;
      state.priceOverrides = {};
      document.getElementById("gap-slider").value = "0";
      document.getElementById("gap-val").textContent = "0.0%";
      renderAll();
      showToast("已重置為昨收基準價");
    });
    document.getElementById("macro-strip").addEventListener("click", () => {
      state.macroExpanded = !state.macroExpanded;
      renderTopMeta();
    });
    document.getElementById("pool-pills").addEventListener("click", (e) => {
      const btn = e.target.closest("[data-pool]");
      if (!btn) return;
      state.pool = btn.dataset.pool;
      document.querySelectorAll("#pool-pills .pill-btn").forEach((b) => b.classList.toggle("active", b === btn));
      renderAll();
    });
    document.getElementById("holding-search").addEventListener("input", (e) => {
      state.searchQuery = e.target.value || "";
      renderHoldingsTable();
    });
    document.getElementById("holding-sort").addEventListener("change", (e) => {
      state.sortBy = e.target.value;
      renderHoldingsTable();
    });
    document.querySelectorAll("[data-main-view]").forEach((btn) => {
      btn.addEventListener("click", () => {
        state.mainView = btn.dataset.mainView;
        applyMobileAndMainView();
      });
    });
    document.querySelectorAll(".mnav-btn").forEach((btn) => {
      btn.addEventListener("click", () => {
        state.mobileTab = btn.dataset.mtab;
        applyMobileAndMainView();
      });
    });
    document.getElementById("drawer-tabs").addEventListener("click", (e) => {
      const btn = e.target.closest("[data-dtab]");
      if (!btn) return;
      state.drawerTab = btn.dataset.dtab;
      renderDrawer();
    });

    // Global delegated clicks (copy price, edit trial price, checklist, open drawer)
    document.body.addEventListener("click", (e) => {
      const copyBtn = e.target.closest("[data-copy-price]");
      if (copyBtn) {
        e.stopPropagation();
        copyText(copyBtn.dataset.copyPrice, `📋 已複製：${copyBtn.dataset.copyLabel || copyBtn.dataset.copyPrice}`);
        return;
      }
      const editBtn = e.target.closest("[data-edit-price]");
      if (editBtn) {
        e.stopPropagation();
        const sid = editBtn.dataset.editPrice;
        const cur = state.priceOverrides[sid] ?? "";
        const raw = prompt(`輸入 ${sid} 的 08:30 試撮價或盤中現價（留空按確定即可還原昨收）：`, String(cur));
        if (raw === null) return;
        const trimmed = raw.trim();
        if (!trimmed) {
          delete state.priceOverrides[sid];
        } else {
          const val = Number(trimmed);
          if (val > 0) state.priceOverrides[sid] = roundTwTick(val, sid);
        }
        renderAll();
        return;
      }
      const chk = e.target.closest("[data-chk-stock]");
      if (chk) {
        e.stopPropagation();
        toggleChecklist(chk.dataset.chkStock);
        return;
      }
      if (e.target.closest("[data-stop-prop]")) return;
      const openEl = e.target.closest("[data-open-stock]");
      if (openEl) openDrawer(openEl.dataset.openStock);
    });

    // Desktop Keyboard Shortcuts (J/K, Esc, /, H, O)
    window.addEventListener("keydown", (e) => {
      if (document.getElementById("app").classList.contains("hidden")) return;
      const tag = (document.activeElement && document.activeElement.tagName) || "";
      const typing = tag === "INPUT" || tag === "TEXTAREA" || tag === "SELECT";
      if (e.key === "Escape") {
        document.getElementById("ticket-modal").classList.add("hidden");
        document.getElementById("strategy-modal").classList.add("hidden");
        closeDrawer();
        return;
      }
      if (typing) return;
      if (e.key === "/") {
        e.preventDefault();
        document.getElementById("holding-search").focus();
      } else if (e.key.toLowerCase() === "h") {
        applyBossMode(!document.body.classList.contains("boss-mode"));
      } else if (e.key.toLowerCase() === "o") {
        openOrderTicketModal();
      } else if (e.key.toLowerCase() === "j" || e.key.toLowerCase() === "k") {
        const list = getFilteredHoldings();
        if (!list.length) return;
        const idx = list.findIndex((x) => x.stock_id === state.selectedStockId);
        const nextIdx = e.key.toLowerCase() === "j"
          ? (idx < 0 ? 0 : (idx + 1) % list.length)
          : (idx <= 0 ? list.length - 1 : idx - 1);
        openDrawer(list[nextIdx].stock_id);
      }
    });

    window.addEventListener("resize", () => { if (state.latest) applyMobileAndMainView(); });

    tryAutoUnlock();
  })();
  </script>
</body>
</html>
